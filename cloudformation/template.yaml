AWSTemplateFormatVersion: '2010-09-09'

Description: 'Nested VPC stack that creates a VPC with DNS support and hostnames enabled, plus an optional Internet Gateway.'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: VPC Configuration
        Parameters:
          - EnvironmentName
          - VpcNameTag
          - VPCCidrBlock
          - EnableDnsHostnames
      - Label:
          default: Internet Connectivity
        Parameters:
          - EnableInternetGateway

    ParameterLabels:
      EnvironmentName:
        default: Environment name (devl, test, prod)
      VpcNameTag:
        default: VPC name prefix for resources
      VPCCidrBlock:
        default: VPC CIDR block (e.g., 10.0.0.0/16)
      EnableDnsHostnames:
        default: Enable DNS hostnames in VPC?
      EnableInternetGateway:
        default: Enable Internet Gateway attachment?


Parameters:
  EnvironmentName:
    Type: String
    Default: devl
    Description: Environment name prefix
    AllowedValues:
      - devl
      - test
      - prod
    ConstraintDescription: Must be devl, test, or prod

  VpcNameTag:
    Type: String
    Description: Name tag prefix for VPC and associated resources
    AllowedPattern: '^[a-zA-Z][-a-zA-Z0-9]*$'
    ConstraintDescription: Must start with letter, contain only alphanumeric and hyphens

  VPCCidrBlock:
    Type: String
    Description: CIDR block for the VPC (e.g., 10.0.0.0/16)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be valid CIDR block
    Default: '10.0.0.0/16'

  EnableDnsHostnames:
    Type: String
    Description: Enable DNS hostnames and DNS support in VPC
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  EnableInternetGateway:
    Type: String
    Description: Enable Internet Gateway attachment to VPC
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  EnableDns: !Equals [!Ref EnableDnsHostnames, 'true']
  CreateInternetGateway: !Equals [!Ref EnableInternetGateway, 'true']


Resources:
  # ============================================================================
  # VPC
  # ============================================================================

  VPC:
    Type: AWS::EC2::VPC
    Metadata:
      com.aws.cloudformation.Context:
        why: Core networking infrastructure for the entire stack; all subnets, route tables, and gateways attach to this VPC
    Properties:
      CidrBlock: !Ref VPCCidrBlock
      EnableDnsHostnames: !If [EnableDns, true, false]
      EnableDnsSupport: !If [EnableDns, true, false]
      Tags:
        - Key: Name
          Value: !Sub '${VpcNameTag}-vpc'
        - Key: Environment
          Value: !Ref EnvironmentName

  # ============================================================================
  # Internet Gateway (Optional)
  # ============================================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateInternetGateway
    Metadata:
      com.aws.cloudformation.Context:
        why: Enables internet connectivity for public subnets; optional to support isolated VPC deployments
        must:
          - Must be attached to VPC via AttachGateway before PublicRoute uses it
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${VpcNameTag}-vpc-igw'
        - Key: Environment
          Value: !Ref EnvironmentName

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateInternetGateway
    Metadata:
      com.aws.cloudformation.Context:
        why: Attaches Internet Gateway to VPC; required before public subnets can route to internet
        must:
          - Must complete before PublicRoute can forward traffic to InternetGateway
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway


# ============================================================================
# Outputs (all commented out while only the VPC resource is active)
# ============================================================================

Outputs:
 VPCId:
   Description: VPC ID
   Value: !Ref VPC

 VPCCidr:
   Description: VPC CIDR Block
   Value: !GetAtt VPC.CidrBlock

 InternetGatewayId:
   Description: Internet Gateway ID
   Condition: CreateInternetGateway
   Value: !Ref InternetGateway
